      const units = [];
      for (let f = 1; f <= floors; f++) {

      const [createMode, setCreateMode] = useState(null);
      const [sortCol, setSortCol] = useState(null);
      const [sortDir, setSortDir] = useState("asc");
      const [columnFilters, setColumnFilters] = useState({});
      const setColFilter = (col, vals) => setColumnFilters((prev) => ({ ...prev, [col]: vals }));

      const toast = useCallback((title, message, type = "info") => {
        const id = uid();
        setToasts((p) => [...p, { id, title, message, type }]);
        setTimeout(() => setToasts((p) => p.filter((t) => t.id !== id)), 4000);
      }, []);

      const updateWO = useCallback((id, changes) => {
        setWorkOrders((prev) => prev.map((wo) => wo.id === id ? { ...wo, ...changes, updated: Date.now() } : wo));
        if (selectedWO?.id === id) setSelectedWO((p) => p ? { ...p, ...changes, updated: Date.now() } : p);
      }, [selectedWO]);

      const addComm = useCallback((woId, type, to, msg) => {
        const comm = { id: uid(), type, to, msg, time: Date.now() };
        setWorkOrders((prev) => prev.map((wo) => wo.id === woId ? { ...wo, communications: [...wo.communications, comm] } : wo));
        if (selectedWO?.id === woId) setSelectedWO((p) => p ? { ...p, communications: [...p.communications, comm] } : p);
      }, [selectedWO]);

      const techSummary = useMemo(() => {
        const counts = { available: 0, "on-job": 0, "en-route": 0, "off-duty": 0 };
        TECHS.forEach((t) => counts[t.status]++);
        return counts;
      }, []);

      if (!user) return <LoginScreen onLogin={setUser} />;

      const isAdmin = user.role === "admin";
      const isDispatch = user.role === "dispatcher" || isAdmin;
      const isTech = user.role === "tech";
      const isTenant = user.role === "tenant";
      const isPM = user.role === "pm";

      const visibleProperties = isPM ? PROPERTIES.filter((p) => user.properties?.includes(p.id)) : PROPERTIES;
      const visibleWOs = workOrders.filter((wo) => {
        if (isTenant) return wo.tenantId === user.id;
        if (isTech) return (wo.techIds || []).includes(user.techId) || wo.subTrades?.some((st) => st.techId === user.techId);
        if (isPM) return user.properties?.includes(wo.propertyId);
        return true;
      });

      const todayStr = new Date().toDateString();
      const isCompletedToday = (wo) => {
        const d = new Date(wo.completedAt || wo.updated);
        return d.toDateString() === todayStr;
      };

      const filtered = visibleWOs.filter((wo) => {
        if (tab === "active") {
          if (["Archived", "Closed"].includes(wo.status)) return false;
          if (wo.status === "Completed" && !isCompletedToday(wo)) return false;
        } else if (tab === "archive") {
          if (!["Archived", "Closed", "Completed"].includes(wo.status)) return false;
          if (wo.status === "Completed" && isCompletedToday(wo)) return false;
        } else if (tab === "renovations") {
          return wo.type === "renovation";
        } else if (tab === "team") {
          return false;
        }
        if (filterProp !== "all" && wo.propertyId !== filterProp) return false;
        if (filterStatus !== "all" && wo.status !== filterStatus) return false;
        if (filterCategory !== "all" && wo.category !== filterCategory) return false;
        if (searchQ) {
          const q = searchQ.toLowerCase();
          if (!(wo.id.toLowerCase().includes(q) || wo.description?.toLowerCase().includes(q) || wo.tenantName?.toLowerCase().includes(q) || (wo.unit || "").includes(q))) return false;
        }
        for (const [col, vals] of Object.entries(columnFilters)) {
          if (!vals || vals.length === 0) continue;
          const prop = PROPERTIES.find((p) => p.id === wo.propertyId);
          const techNames = (wo.techIds || []).map((id) => TECHS.find((t) => t.id === id)?.name).filter(Boolean);
          let woVal;
          if (col === "type") woVal = wo.type;
          else if (col === "property") woVal = prop?.name || "";
          else if (col === "unit") woVal = wo.unit || "";
          else if (col === "category") woVal = wo.category || "";
          else if (col === "priority") woVal = wo.priority || "";
          else if (col === "status") woVal = wo.status || "";
          else if (col === "tech") { if (!vals.some((v) => techNames.includes(v))) return false; continue; }
          else continue;
          if (!vals.includes(woVal)) return false;
        }
        return true;
      }).sort((a, b) => {
        if (sortCol) {
          const dir = sortDir === "asc" ? 1 : -1;
          const propA = PROPERTIES.find((p) => p.id === a.propertyId);
          const propB = PROPERTIES.find((p) => p.id === b.propertyId);
          const techA = TECHS.find((t) => t.id === (a.techIds || [])[0]);
          const techB = TECHS.find((t) => t.id === (b.techIds || [])[0]);
          const priOrdS = { Urgent: 0, High: 1, Medium: 2, Low: 3 };
          switch (sortCol) {
            case "id": return dir * a.id.localeCompare(b.id);
            case "type": return dir * a.type.localeCompare(b.type);
            case "property": return dir * (propA?.name || "").localeCompare(propB?.name || "");
            case "unit": return dir * (a.unit || "").localeCompare(b.unit || "");
            case "category": return dir * (a.category || "").localeCompare(b.category || "");
            case "priority": return dir * ((priOrdS[a.priority] ?? 9) - (priOrdS[b.priority] ?? 9));
            case "status": return dir * a.status.localeCompare(b.status);
            case "tech": return dir * ((techA?.name || "").localeCompare(techB?.name || ""));
            case "updated": return dir * (a.updated - b.updated);
            case "scheduled": {
              const da = a.scheduledDate || "9999";
              const db = b.scheduledDate || "9999";
              return dir * da.localeCompare(db);
            }
            default: break;
          }
        }
        const priOrd = { Urgent: 0, High: 1, Medium: 2, Low: 3 };
        const statOrd = { "Needs Review": 0, Unassigned: 1, "In Progress": 2, Assigned: 3, Completed: 4, Closed: 5, Archived: 6 };
        if ((statOrd[a.status] ?? 9) !== (statOrd[b.status] ?? 9)) return (statOrd[a.status] ?? 9) - (statOrd[b.status] ?? 9);
        if ((priOrd[a.priority] ?? 9) !== (priOrd[b.priority] ?? 9)) return (priOrd[a.priority] ?? 9) - (priOrd[b.priority] ?? 9);
        return b.updated - a.updated;
      });

      const openDetail = (wo) => { setSelectedWO({ ...wo }); setCreateMode(null); };
      const closeDetail = () => { setSelectedWO(null); setTechDetail(null); };

      const assignWO = (woId, techIds, priority) => {
        const tech = TECHS.find((t) => t.id === techIds[0]);
        updateWO(woId, { techIds, techId: techIds[0] || null, priority, status: "Assigned", dispatchedBy: user.name });
        addComm(woId, "sms", "tech", `New assignment: ${woId}. Check your queue.`);
        toast("Assigned", `${woId} → ${tech?.name}`, "info");
      };

      const startWork = (woId) => {
        const wo = workOrders.find((w) => w.id === woId);
        updateWO(woId, { status: "In Progress", arrivedAt: Date.now() });
        addComm(woId, "sms", "tenant", "A technician has started work on your repair.");
        addComm(woId, "email", "pm", `Work started: ${woId} Unit ${wo?.unit}`);
        toast("Notifications sent", "Tenant (SMS) + Property Manager (email)", "info");
      };

      const completeWork = (woId, notes) => {
        const wo = workOrders.find((w) => w.id === woId);
        updateWO(woId, { status: "Completed", completionNotes: notes, completedAt: Date.now() });
        addComm(woId, "sms", "tenant", "Your repair is now complete!");
        addComm(woId, "email", "pm", `Work completed: ${woId} Unit ${wo?.unit}`);
        toast("Completed", `${woId} marked complete. Notifications sent.`, "info");
      };

      const flagReview = (woId, note) => {
        updateWO(woId, { status: "Needs Review", notes: note });
        addComm(woId, "email", "dispatch", `Tech flagged ${woId} for review: ${note}`);
        toast("Flagged", `${woId} sent to dispatch for review`, "warn");
      };

      const stopWork = (woId) => {
        updateWO(woId, { status: "Assigned" });
        toast("Stopped", `${woId} returned to Assigned`, "warn");
      };

      const closeWO = (woId, note) => {
        updateWO(woId, { status: "Closed", closedBy: `${user.role === "admin" ? "Admin" : "Dispatcher"} (${user.name})`, closedNote: note });
        toast("Closed", `${woId} closed and archived`, "info");
      };

      return (
        <div style={S.app}>
          <nav style={S.nav}>
            <div style={{ display: "flex", alignItems: "center", gap: 20 }}>
              <span style={S.logo}>ROM<span style={{ color: "#f59e0b" }}>repair</span></span>
              {isDispatch && <span style={{ fontSize: 12, color: "#64748b", background: "rgba(255,255,255,0.06)", padding: "3px 10px", borderRadius: 4 }}>Dispatch Console</span>}
            </div>
            <div style={S.navRight}>
              <span style={S.navUser}>{user.name} · <span style={{ textTransform: "capitalize" }}>{user.role === "pm" ? "Property Manager" : user.role}</span></span>
              <button style={S.navBtn} onClick={() => { setUser(null); setSelectedWO(null); setTab("active"); }}>Sign Out</button>
            </div>
          </nav>

          {isTenant && <TenantView user={user} workOrders={visibleWOs} toast={toast} setWorkOrders={setWorkOrders} />}
          {isTech && <TechView user={user} workOrders={visibleWOs} techs={TECHS} startWork={startWork} completeWork={completeWork} flagReview={flagReview} stopWork={stopWork} updateWO={updateWO} toast={toast} />}

          {(isDispatch || isPM) && (
            <div style={S.page}>
              <div style={{ ...S.tabBar, justifyContent: "space-between" }}>
                <div style={{ display: "flex", gap: 2 }}>
                  {["active", "renovations", "team", "archive"].map((t) => (
                    <button key={t} style={S.tab(tab === t)} onClick={() => setTab(t)}>
                      {t === "active" ? "Active Work Orders" : t === "renovations" ? "Renovations" : t === "team" ? "Team Grid" : "Archive"}
                    </button>
                  ))}
                </div>
                {isDispatch && (
                  <div style={{ display: "flex", gap: 8, padding: "8px 0" }}>
                    <button style={S.btn("primary")} onClick={() => { setCreateMode("repair"); setSelectedWO(null); }}>+ Work Order</button>
                    <button style={{ ...S.btn("secondary"), borderColor: "#f59e0b", color: "#92400e", background: "#fffbeb" }} onClick={() => { setCreateMode("renovation"); setSelectedWO(null); }}>+ Renovation</button>
                  </div>
                )}
              </div>

              <div style={{ ...S.card, padding: 0 }}>
                {isDispatch && tab !== "team" && tab !== "archive" && (
                  <TechWorkloadStrip techs={TECHS} expanded={techExpanded} toggle={() => setTechExpanded(!techExpanded)} onTechClick={setTechDetail} workOrders={workOrders} />
                )}
                {tab === "team" && <TeamGrid techs={TECHS} workOrders={workOrders} onTechClick={setTechDetail} />}
                {tab === "archive" && <ArchiveTab workOrders={filtered} openDetail={openDetail} />}
                {(tab === "active" || tab === "renovations") && (
                  <>
                    <div style={{ padding: "14px 18px", display: "flex", gap: 10, flexWrap: "wrap", borderBottom: "1px solid #e5e7eb", alignItems: "center" }}>
                      <input style={{ ...S.input, maxWidth: 220 }} placeholder="Search ID, description, tenant…" value={searchQ} onChange={(e) => setSearchQ(e.target.value)} />
                      <select style={S.select} value={filterProp} onChange={(e) => setFilterProp(e.target.value)}>
                        <option value="all">All Properties</option>
                        {visibleProperties.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
                      </select>
                      <select style={S.select} value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)}>
                        <option value="all">All Statuses</option>
                        {STATUSES.filter((s) => s !== "Archived" && s !== "Closed").map((s) => <option key={s} value={s}>{s}</option>)}
                      </select>
                      {tab === "active" && (
                        <select style={S.select} value={filterCategory} onChange={(e) => setFilterCategory(e.target.value)}>
                          <option value="all">All Categories</option>
                          {[...CATEGORIES, "Renovation"].map((c) => <option key={c} value={c}>{c}</option>)}
                        </select>
                      )}
                      <span style={{ marginLeft: "auto", fontSize: 12, color: "#94a3b8" }}>{filtered.length} result{filtered.length !== 1 ? "s" : ""}</span>
                    </div>
                    <div style={{ overflowX: "auto" }}>
                      <table>
                        <thead>
                          <tr style={{ background: "#fafbfc" }}>
                            {(() => {
                              const uv = (col) => {
                                const vals = new Set();
                                visibleWOs.forEach((wo) => {
                                  if (col === "type") vals.add(wo.type);
                                  else if (col === "property") { const p = PROPERTIES.find((p) => p.id === wo.propertyId); if (p) vals.add(p.name); }
                                  else if (col === "unit") { if (wo.unit) vals.add(wo.unit); }
                                  else if (col === "category") { if (wo.category) vals.add(wo.category); }
                                  else if (col === "priority") { if (wo.priority) vals.add(wo.priority); }
                                  else if (col === "status") { if (wo.status) vals.add(wo.status); }
                                  else if (col === "tech") { (wo.techIds || []).forEach((id) => { const t = TECHS.find((t) => t.id === id); if (t) vals.add(t.name); }); }
                                });
                                return [...vals].sort();
                              };
                              const onSort = (col) => { if (sortCol === col) setSortDir(sortDir === "asc" ? "desc" : "asc"); else { setSortCol(col); setSortDir("asc"); } };
                              const cols = [
                                { col: "id", label: "WO #", filterable: false },
                                { col: "type", label: "Type", filterable: true },
                                { col: "property", label: "Property", filterable: true },
                                { col: "unit", label: "Unit", filterable: true },
                                { col: "category", label: "Category", filterable: true },
                                { col: "priority", label: "Priority", filterable: true },
                                { col: "status", label: "Status", filterable: true },
                                { col: "tech", label: "Assigned To", filterable: true },
                                { col: "scheduled", label: "Scheduled", filterable: false },
                                { col: "updated", label: "Updated", filterable: false },
                              ];
                              return cols.map(({ col, label, filterable }) => (
                                <SortFilterTh key={col} col={col} label={label} sortCol={sortCol} sortDir={sortDir} onSort={onSort} colFilters={columnFilters} uniqueVals={filterable ? uv(col) : null} onFilter={setColFilter} />
                              ));
                            })()}
                          </tr>
                        </thead>
                        <tbody>
                          {filtered.map((wo) => {
                            const prop = PROPERTIES.find((p) => p.id === wo.propertyId);
                            const woTechNames = (wo.techIds || []).map((id) => TECHS.find((t) => t.id === id)?.name).filter(Boolean);
                            return (
                              <tr key={wo.id} onClick={() => openDetail(wo)} style={{ cursor: "pointer", transition: "background 0.1s" }}>
                                <td style={{ ...S.td, ...S.mono, fontWeight: 600, color: "#7a00df" }}>{wo.id}</td>
                                <td style={S.td}><span style={{ fontSize: 11, padding: "2px 8px", borderRadius: 4, background: wo.type === "renovation" ? "#fef3c7" : "#f3e8ff", color: wo.type === "renovation" ? "#92400e" : "#5800b0", fontWeight: 600, textTransform: "uppercase" }}>{wo.type}</span></td>
                                <td style={S.tdWrap}>{prop?.name}</td>
                                <td style={{ ...S.td, ...S.mono }}>{wo.unit}</td>
                                <td style={S.td}>{wo.category}</td>
                                <td style={S.td}><PriorityBadge priority={wo.priority} /></td>
                                <td style={S.td}><StatusBadge status={wo.status} /></td>
                                <td style={S.td}>{woTechNames.length ? woTechNames.join(", ") : <span style={{ color: "#d1d5db" }}>—</span>}</td>
                                <td style={{ ...S.td, fontSize: 12 }}>
                                  {wo.scheduledDate ? (
                                    <span style={{ color: "#7a00df", fontWeight: 500 }}>
                                      {new Date(wo.scheduledDate + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" })}
                                      {wo.scheduledSlot && <span style={{ color: "#94a3b8", fontWeight: 400 }}> · {wo.scheduledSlot}</span>}
                                    </span>
                                  ) : <span style={{ color: "#d1d5db" }}>—</span>}
                                </td>
                                <td style={{ ...S.td, color: "#94a3b8", fontSize: 12 }}>{fmt(wo.updated)}</td>
                              </tr>
                            );
                          })}
                          {filtered.length === 0 && (
                            <tr><td colSpan={10} style={{ padding: 40, textAlign: "center", color: "#94a3b8" }}>No work orders found</td></tr>
                          )}
                        </tbody>
                      </table>
                    </div>
                  </>
                )}
              </div>
            </div>
          )}

          <div style={S.overlay(!!selectedWO)} onClick={closeDetail} />
          <div style={S.slidePanel(!!selectedWO)}>
            {selectedWO && (
              <DetailPanel
                wo={selectedWO}
                workOrders={workOrders}
                techs={TECHS}
                properties={PROPERTIES}
                isDispatch={isDispatch}
                isPM={isPM}
                user={user}
                onClose={closeDetail}
                updateWO={updateWO}
                assignWO={assignWO}
                startWork={startWork}
                completeWork={completeWork}
                flagReview={flagReview}
                closeWO={closeWO}
                addComm={addComm}
                toast={toast}
                setWorkOrders={setWorkOrders}
              />
            )}
          </div>

          {techDetail && (
            <>
              <div style={S.overlay(true)} onClick={() => setTechDetail(null)} />
              <div style={S.slidePanel(true)}>
                <TechDetailPanel tech={techDetail} workOrders={workOrders} onClose={() => setTechDetail(null)} />
              </div>
            </>
          )}

          <div style={S.overlay(!!createMode)} onClick={() => setCreateMode(null)} />
          <div style={S.slidePanel(!!createMode)}>
            {createMode && (
              <CreateWOPanel
                mode={createMode}
                properties={PROPERTIES}
                techs={TECHS}
                user={user}
                onClose={() => setCreateMode(null)}
                onCreate={(wo) => {
                  setWorkOrders((p) => [wo, ...p]);
                  setCreateMode(null);
                  toast("Created", `${wo.id} created successfully`, "info");
                  if (wo.type === "renovation") setTab("renovations");
                }}
              />
            )}
          </div>

          <Toast toasts={toasts} />
        </div>
      );
    }

    // ─── Sort + Filter Column Header ─────────────────────────────────────────────

    function SortFilterTh({ col, label, sortCol, sortDir, onSort, colFilters, uniqueVals, onFilter }) {
      const [open, setOpen] = useState(false);
      const active = (colFilters[col] || []);
      const hasFilter = active.length > 0;
      const showFilter = uniqueVals && uniqueVals.length > 0;

      return (
        <th style={{ ...S.th, position: "relative", userSelect: "none" }}>
          <div style={{ display: "inline-flex", alignItems: "center", gap: 3 }}>
            <span style={{ cursor: "pointer" }} onClick={() => onSort(col)}>
              {label}
              <span style={{ fontSize: 10, color: sortCol === col ? "#7a00df" : "#d1d5db", marginLeft: 3 }}>
                {sortCol === col ? (sortDir === "asc" ? "▲" : "▼") : "⇅"}
              </span>
            </span>
            {showFilter && (
              <span style={{ position: "relative" }}>
                <button
                  onMouseDown={(e) => { e.stopPropagation(); setOpen((o) => !o); }}
                  style={{ background: hasFilter ? "#f3e8ff" : "none", border: "none", cursor: "pointer", padding: "1px 4px", color: hasFilter ? "#7a00df" : "#94a3b8", fontSize: 11, borderRadius: 3, lineHeight: 1.2 }}
                  title="Filter"
                >▾</button>
                {open && (
                  <div
                    style={{ position: "absolute", top: "calc(100% + 4px)", left: 0, background: "#fff", border: "1px solid #d1d5db", borderRadius: 8, boxShadow: "0 6px 20px rgba(0,0,0,0.12)", zIndex: 500, minWidth: 160, maxHeight: 240, overflowY: "auto" }}
                    onMouseLeave={() => setOpen(false)}
                  >
                    {hasFilter && (
                      <div onMouseDown={() => { onFilter(col, []); }} style={{ padding: "7px 12px", fontSize: 11, color: "#7a00df", fontWeight: 700, cursor: "pointer", borderBottom: "1px solid #f3f4f6", display: "flex", alignItems: "center", gap: 6 }}>
                        ✕ Clear filter
                      </div>
                    )}
                    {uniqueVals.map((val) => {
                      const checked = active.includes(val);
                      return (
                        <div key={val} onMouseDown={() => onFilter(col, checked ? active.filter((v) => v !== val) : [...active, val])}
                          style={{ padding: "7px 12px", fontSize: 12, cursor: "pointer", display: "flex", alignItems: "center", gap: 8, background: checked ? "#f9f0ff" : "#fff" }}>
                          <input type="checkbox" checked={checked} readOnly style={{ accentColor: "#7a00df", cursor: "pointer" }} />
                          <span style={{ fontWeight: checked ? 600 : 400 }}>{val}</span>
                        </div>
                      );
                    })}
                  </div>
                )}
              </span>
            )}
          </div>
        </th>
      );
    }

    // ─── Smart Search Component ──────────────────────────────────────────────────

    function SmartSearch({ placeholder, options, onSelect, style }) {
      // options: [{ id, label, sublabel }]
      const [query, setQuery] = useState("");
      const [open, setOpen] = useState(false);
      const [selected, setSelected] = useState(null);

      const filtered = query
        ? options.filter((o) => o.label.toLowerCase().includes(query.toLowerCase()) || (o.sublabel && o.sublabel.toLowerCase().includes(query.toLowerCase())))
        : options;

      const handleSelect = (opt) => {
        setSelected(opt);
        setQuery(opt.label);
        setOpen(false);
        onSelect(opt.id);
      };

      const handleClear = (e) => {
        e.stopPropagation();
        setSelected(null);
        setQuery("");
        onSelect("");
      };

      return (
        <div style={{ position: "relative", ...style }}>
          <div style={{ position: "relative" }}>
            <input
              style={{ ...S.input, paddingRight: selected ? 28 : 12 }}
              value={query}
              placeholder={placeholder}
              onChange={(e) => { setQuery(e.target.value); setOpen(true); if (!e.target.value) { setSelected(null); onSelect(""); } }}
              onFocus={() => setOpen(true)}
              onBlur={() => setTimeout(() => setOpen(false), 150)}
            />
            {selected && (
              <button onMouseDown={handleClear} style={{ position: "absolute", right: 8, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", cursor: "pointer", color: "#94a3b8", fontSize: 14, padding: 0, lineHeight: 1 }}>✕</button>
            )}
          </div>
          {open && filtered.length > 0 && (
            <div style={{ position: "absolute", top: "calc(100% + 2px)", left: 0, right: 0, background: "#fff", border: "1px solid #d1d5db", borderRadius: 6, boxShadow: "0 4px 12px rgba(0,0,0,0.12)", zIndex: 300, maxHeight: 200, overflowY: "auto" }}>
              {filtered.map((opt) => (
                <div key={opt.id} onMouseDown={() => handleSelect(opt)} style={{ padding: "8px 12px", cursor: "pointer", fontSize: 13, borderBottom: "1px solid #f3f4f6" }}
                  onMouseEnter={(e) => e.currentTarget.style.background = "#f9f0ff"}
                  onMouseLeave={(e) => e.currentTarget.style.background = "#fff"}>
                  <div style={{ fontWeight: 500 }}>{opt.label}</div>
                  {opt.sublabel && <div style={{ fontSize: 11, color: "#94a3b8", marginTop: 1 }}>{opt.sublabel}</div>}
                </div>
              ))}
            </div>
          )}
          {open && filtered.length === 0 && query && (
            <div style={{ position: "absolute", top: "calc(100% + 2px)", left: 0, right: 0, background: "#fff", border: "1px solid #d1d5db", borderRadius: 6, padding: "8px 12px", fontSize: 13, color: "#94a3b8", zIndex: 300 }}>
              No results for "{query}"
            </div>
          )}
        </div>
      );
    }

    // ─── Create Work Order / Renovation Panel ────────────────────────────────────

    function CreateWOPanel({ mode, properties, techs, user, onClose, onCreate }) {
      const [propId, setPropId] = useState("");
      const [unit, setUnit] = useState("");
      const [category, setCategory] = useState("Plumbing");
      const [description, setDescription] = useState("");
      const [priority, setPriority] = useState("Medium");
      const [assignTechs, setAssignTechs] = useState([]);
      const [subTrades, setSubTrades] = useState([]);
      const [scheduledDate, setScheduledDate] = useState("");
      const [scheduledSlot, setScheduledSlot] = useState("Morning");
      const [error, setError] = useState("");

      const selectedProp = properties.find((p) => p.id === propId);
      const unitOptions = selectedProp ? getPropertyUnits(selectedProp) : [];

      const propSearchOptions = properties.map((p) => ({ id: p.id, label: p.name, sublabel: p.address }));

      const isReno = mode === "renovation";

      const toggleSubTrade = (trade) => {
        setSubTrades((p) => {
          const exists = p.find((st) => st.trade === trade);
          if (exists) return p.filter((st) => st.trade !== trade);
          return [...p, { id: uid(), trade, status: "Unassigned", techId: null, notes: "", scheduledDate: "", scheduledSlot: "Morning" }];
        });
      };

      const updateSubTrade = (idx, changes) => {
        setSubTrades((p) => p.map((st, i) => i === idx ? { ...st, ...changes } : st));
      };

      const handleCreate = () => {
        if (!propId) { setError("Select a property"); return; }
        if (!unit.trim()) { setError("Enter a unit number"); return; }
        if (!description.trim()) { setError("Enter a description"); return; }
        if (isReno && subTrades.length === 0) { setError("Add at least one sub-trade"); return; }

        const woId = `WO-${1100 + Math.floor(Math.random() * 900)}`;
        const hasAssignment = isReno ? subTrades.some((st) => st.techId) : assignTechs.length > 0;

        const wo = {
          id: woId,
          type: isReno ? "renovation" : "repair",
          propertyId: propId,
          unit: unit,
          category: isReno ? "Renovation" : category,
          description: description.trim(),
          urgency: priority === "Urgent",
          status: hasAssignment ? "Assigned" : "Unassigned",
          priority,
          techIds: isReno ? [] : assignTechs,
          techId: isReno ? null : (assignTechs[0] || null),
          tenantId: null,
          tenantName: null,
          created: Date.now(),
          updated: Date.now(),
          scheduledDate: scheduledDate || null,
          scheduledSlot: scheduledDate ? scheduledSlot : null,
          createdBy: user.name,
          dispatchedBy: null,
          arrivedAt: null,
          completedAt: null,
          photos: [],
          communications: [{
            id: uid(), type: "email", to: "dispatch",
            msg: `${isReno ? "Renovation" : "Work order"} ${woId} created by ${user.name}.`,
            time: Date.now(),
          }],
          notes: "",
          completionNotes: "",
          closedBy: null,
          closedNote: "",
          ...(isReno ? { subTrades: subTrades.map((st) => ({ ...st, status: st.techId ? "Assigned" : "Unassigned" })) } : {}),
        };
        onCreate(wo);
      };

      const sectionStyle = { padding: "16px 20px", borderBottom: "1px solid #f3f4f6" };
      const fieldLabel = { ...S.label, marginBottom: 4 };

      return (
        <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
          <div style={{ padding: "16px 20px", borderBottom: "1px solid #e5e7eb", display: "flex", justifyContent: "space-between", alignItems: "center", flexShrink: 0 }}>
            <div>
              <div style={{ fontWeight: 700, fontSize: 18, display: "flex", alignItems: "center", gap: 10 }}>
                {isReno ? "New Renovation" : "New Work Order"}
                <span style={{ fontSize: 11, padding: "2px 8px", borderRadius: 4, background: isReno ? "#fef3c7" : "#f3e8ff", color: isReno ? "#92400e" : "#5800b0", fontWeight: 600, textTransform: "uppercase" }}>{mode}</span>
              </div>
              <div style={{ fontSize: 12, color: "#94a3b8", marginTop: 2 }}>Created by {user.name}</div>
            </div>
            <button onClick={onClose} style={{ background: "none", border: "none", fontSize: 22, cursor: "pointer", color: "#94a3b8", padding: 4 }}>✕</button>
          </div>

          <div style={{ flex: 1, overflowY: "auto" }}>
            <div style={sectionStyle}>
              <div style={{ display: "flex", gap: 12 }}>
                <div style={{ flex: 1 }}>
                  <div style={fieldLabel}>Property</div>
                  <SmartSearch
                    placeholder="Search property…"
                    options={propSearchOptions}
                    onSelect={(id) => { setPropId(id); setUnit(""); }}
                  />
                </div>
                <div style={{ width: 140 }}>
                  <div style={fieldLabel}>Unit</div>
                  <select style={{ ...S.select, width: "100%" }} value={unit} onChange={(e) => setUnit(e.target.value)} disabled={!propId}>
                    <option value="">{propId ? "Select unit…" : "Pick property first"}</option>
                    {unitOptions.map((u) => <option key={u} value={u}>{u}</option>)}
                  </select>
                </div>
              </div>
            </div>

            {!isReno && (
              <div style={sectionStyle}>
                <div style={fieldLabel}>Category</div>
                <select style={{ ...S.select, width: "100%" }} value={category} onChange={(e) => setCategory(e.target.value)}>
                  {CATEGORIES.map((c) => <option key={c}>{c}</option>)}
                </select>
              </div>
            )}

            <div style={sectionStyle}>
              <div style={fieldLabel}>Description</div>
              <textarea style={S.textarea} rows={3} placeholder={isReno ? "Describe renovation scope…" : "Describe the issue…"} value={description} onChange={(e) => setDescription(e.target.value)} />
            </div>

            <div style={sectionStyle}>
              <div style={fieldLabel}>Priority</div>
              <div style={{ display: "flex", gap: 6 }}>
                {PRIORITIES.map((p) => (
                  <button key={p} onClick={() => setPriority(p)} style={{ ...S.priBadge(PRIORITY_COLORS[p]), cursor: "pointer", opacity: priority === p ? 1 : 0.4, transform: priority === p ? "scale(1.08)" : "scale(1)", transition: "all 0.15s", border: `2px solid ${priority === p ? PRIORITY_COLORS[p].border : "transparent"}` }}>{p}</button>
                ))}
              </div>
            </div>

            {!isReno && (
              <div style={sectionStyle}>
                <div style={fieldLabel}>Assign Technicians (optional)</div>
                <div style={{ border: "1px solid #e5e7eb", borderRadius: 6, overflow: "hidden", marginTop: 4 }}>
                  {techs.filter((t) => t.status !== "off-duty").map((t) => {
                    const checked = assignTechs.includes(t.id);
                    return (
                      <label key={t.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 12px", cursor: "pointer", background: checked ? "#f9f0ff" : "#fff", borderLeft: checked ? "3px solid #7a00df" : "3px solid transparent", borderBottom: "1px solid #f3f4f6", transition: "all 0.1s" }}>
                        <input type="checkbox" checked={checked} onChange={() => setAssignTechs((prev) => checked ? prev.filter((id) => id !== t.id) : [...prev, t.id])} style={{ accentColor: "#7a00df" }} />
                        <span style={{ flex: 1, fontSize: 13, fontWeight: checked ? 600 : 400 }}>{t.name}</span>
                        <span style={{ fontSize: 11, color: "#94a3b8" }}>{t.specialty}</span>
                        <CapacityBar used={t.activeJobs} total={t.capacity} />
                      </label>
                    );
                  })}
                </div>
                {assignTechs.length > 0 && <div style={{ fontSize: 12, color: "#7a00df", marginTop: 6 }}>Selected: {assignTechs.map((id) => techs.find((t) => t.id === id)?.name).join(", ")}</div>}
              </div>
            )}

            {isReno && (
              <div style={sectionStyle}>
                <div style={{ ...fieldLabel, marginBottom: 10 }}>Sub-Trades</div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 14 }}>
                  {SUB_TRADE_TYPES.map((trade) => {
                    const sel = subTrades.some((st) => st.trade === trade);
                    return (
                      <button key={trade} type="button" onClick={() => toggleSubTrade(trade)} style={{ padding: "7px 14px", borderRadius: 20, fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: "'Montserrat', sans-serif", border: `2px solid ${sel ? "#7a00df" : "#d1d5db"}`, background: sel ? "#f3e8ff" : "#fff", color: sel ? "#7a00df" : "#64748b", transition: "all 0.15s" }}>
                        {sel ? "✓ " : ""}{trade}
                      </button>
                    );
                  })}
                </div>
                {subTrades.length === 0 && <div style={{ fontSize: 12, color: "#d1d5db" }}>Select one or more trades above</div>}
                {subTrades.map((st, i) => (
                  <div key={st.id} style={{ padding: "12px 14px", background: "#fafafa", borderRadius: 8, marginBottom: 8, border: "1px solid #e5e7eb" }}>
                    <div style={{ fontWeight: 700, fontSize: 13, color: "#7a00df", marginBottom: 8 }}>{st.trade}</div>
                    <div style={{ display: "flex", gap: 8, marginBottom: 8, flexWrap: "wrap" }}>
                      <select style={{ ...S.select, flex: 1, minWidth: 140, fontSize: 12 }} value={st.techId || ""} onChange={(e) => updateSubTrade(i, { techId: e.target.value || null })}>
                        <option value="">Assign tech…</option>
                        {techs.filter((t) => t.status !== "off-duty").map((t) => <option key={t.id} value={t.id}>{t.name} ({t.specialty})</option>)}
                      </select>
                      <input type="date" style={{ ...S.input, width: 150, fontSize: 12 }} value={st.scheduledDate || ""} onChange={(e) => updateSubTrade(i, { scheduledDate: e.target.value })} />
                      <div style={{ display: "flex", gap: 4 }}>
                        {["Morning", "Afternoon"].map((slot) => (
                          <button key={slot} type="button" onClick={() => updateSubTrade(i, { scheduledSlot: slot })} style={{ padding: "5px 10px", borderRadius: 6, fontSize: 11, fontWeight: 600, cursor: "pointer", fontFamily: "'Montserrat', sans-serif", border: `1px solid ${st.scheduledSlot === slot && st.scheduledDate ? "#7a00df" : "#d1d5db"}`, background: st.scheduledSlot === slot && st.scheduledDate ? "#f3e8ff" : "#fff", color: st.scheduledSlot === slot && st.scheduledDate ? "#7a00df" : "#64748b", opacity: st.scheduledDate ? 1 : 0.4 }}>{slot}</button>
                        ))}
                      </div>
                    </div>
                    <input style={{ ...S.input, fontSize: 12 }} placeholder="Notes for this trade…" value={st.notes} onChange={(e) => updateSubTrade(i, { notes: e.target.value })} />
                  </div>
                ))}
              </div>
            )}

            <div style={sectionStyle}>
              <div style={fieldLabel}>Schedule (optional)</div>
              <div style={{ display: "flex", gap: 10, alignItems: "flex-end", flexWrap: "wrap" }}>
                <div style={{ flex: 1, minWidth: 140 }}>
                  <div style={{ fontSize: 11, color: "#94a3b8", marginBottom: 4 }}>Date</div>
                  <input type="date" style={{ ...S.input }} value={scheduledDate} onChange={(e) => setScheduledDate(e.target.value)} />
                </div>
                <div>
                  <div style={{ fontSize: 11, color: "#94a3b8", marginBottom: 4 }}>Time Window</div>
                  <div style={{ display: "flex", gap: 6 }}>
                    {["Morning", "Afternoon"].map((slot) => (
                      <button key={slot} onClick={() => setScheduledSlot(slot)} style={{ padding: "7px 16px", borderRadius: 6, fontSize: 13, fontWeight: 500, cursor: "pointer", fontFamily: "'Montserrat', sans-serif", border: `2px solid ${scheduledSlot === slot && scheduledDate ? "#7a00df" : "#d1d5db"}`, background: scheduledSlot === slot && scheduledDate ? "#f3e8ff" : "#fff", color: scheduledSlot === slot && scheduledDate ? "#5800b0" : "#374151", opacity: scheduledDate ? 1 : 0.4, transition: "all 0.15s" }}>{slot}</button>
                    ))}
                  </div>
                </div>
              </div>
              {scheduledDate && <div style={{ fontSize: 11, color: "#94a3b8", marginTop: 6 }}>Tenant will be notified to expect technician in the {scheduledSlot.toLowerCase()}.</div>}
            </div>

            {error && <div style={{ padding: "10px 20px", fontSize: 13, color: "#dc2626", background: "#fef2f2" }}>{error}</div>}
          </div>

          <div style={{ padding: "14px 20px", borderTop: "1px solid #e5e7eb", display: "flex", gap: 8, flexShrink: 0 }}>
            <button style={S.btn("primary")} onClick={handleCreate}>{isReno ? "Create Renovation" : "Create Work Order"}</button>
            <button style={S.btn("secondary")} onClick={onClose}>Cancel</button>
          </div>
        </div>
      );
    }

    function DetailPanel({ wo, workOrders, techs, properties, isDispatch, isPM, user, onClose, updateWO, assignWO, startWork, completeWork, flagReview, closeWO, addComm, toast, setWorkOrders }) {
      const [assignTechs, setAssignTechs] = useState(wo.techIds || []);
      const [assignPri, setAssignPri] = useState(wo.priority || "Medium");
      const [closeNote, setCloseNote] = useState("");
      const [compNotes, setCompNotes] = useState(wo.completionNotes || "");
      const [showCloseForm, setShowCloseForm] = useState(false);
      const [newSubTrade, setNewSubTrade] = useState("");

      const liveWO = workOrders.find((w) => w.id === wo.id) || wo;
      const prop = properties.find((p) => p.id === liveWO.propertyId);

      const sectionStyle = { padding: "16px 20px", borderBottom: "1px solid #f3f4f6" };
      const fieldRow = { display: "flex", gap: 12, marginBottom: 10 };
      const fieldLabel = { ...S.label, marginBottom: 4 };

      return (
        <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
          <div style={{ padding: "16px 20px", borderBottom: "1px solid #e5e7eb", display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexShrink: 0 }}>
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>
                <span style={{ ...S.mono, fontWeight: 700, fontSize: 18, color: "#7a00df" }}>{liveWO.id}</span>
                <span style={{ fontSize: 11, padding: "2px 8px", borderRadius: 4, background: liveWO.type === "renovation" ? "#fef3c7" : "#f3e8ff", color: liveWO.type === "renovation" ? "#92400e" : "#5800b0", fontWeight: 600, textTransform: "uppercase" }}>{liveWO.type}</span>
              </div>
              <div style={{ fontSize: 13, color: "#64748b" }}>{prop?.name} · Unit {liveWO.unit}</div>
            </div>
            <button onClick={onClose} style={{ background: "none", border: "none", fontSize: 22, cursor: "pointer", color: "#94a3b8", padding: 4 }}>✕</button>
          </div>

          <div style={{ flex: 1, overflowY: "auto" }}>
            <div style={{ ...sectionStyle, display: "flex", gap: 12, alignItems: "center" }}>
              <StatusBadge status={liveWO.status} />
              <PriorityBadge priority={liveWO.priority} />
              {liveWO.urgency && <span style={{ fontSize: 11, fontWeight: 600, color: "#dc2626" }}>URGENT</span>}
            </div>

            <div style={sectionStyle}>
              <div style={fieldLabel}>Description</div>
              <div style={{ fontSize: 14, lineHeight: 1.5 }}>{liveWO.description}</div>
              {liveWO.tenantName && <div style={{ fontSize: 12, color: "#94a3b8", marginTop: 8 }}>Submitted by {liveWO.tenantName}</div>}
            </div>

            <div style={{ ...sectionStyle, display: "flex", gap: 24, flexWrap: "wrap" }}>
              <div><div style={fieldLabel}>Created</div><div style={{ fontSize: 13 }}>{fmt(liveWO.created)}</div></div>
              <div><div style={fieldLabel}>Updated</div><div style={{ fontSize: 13 }}>{fmt(liveWO.updated)}</div></div>
              {liveWO.scheduledDate && (
                <div>
                  <div style={fieldLabel}>Scheduled</div>
                  <div style={{ fontSize: 13, display: "flex", alignItems: "center", gap: 6 }}>
                    <span style={{ fontWeight: 600, color: "#7a00df" }}>
                      {new Date(liveWO.scheduledDate + "T12:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" })}
                    </span>
                    {liveWO.scheduledSlot && (
                      <span style={{ fontSize: 11, padding: "2px 8px", borderRadius: 99, background: "#f3e8ff", color: "#5800b0", fontWeight: 600 }}>{liveWO.scheduledSlot}</span>
                    )}
                  </div>
                </div>
              )}
            </div>

            {isDispatch && !["Completed", "Closed", "Archived"].includes(liveWO.status) && liveWO.type === "repair" && (
              <div style={sectionStyle}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                  <div style={fieldLabel}>Assign Technicians</div>
                  <select style={{ ...S.select, width: 120 }} value={assignPri} onChange={(e) => setAssignPri(e.target.value)}>
                    {PRIORITIES.map((p) => <option key={p} value={p}>{p}</option>)}
                  </select>
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 4, marginBottom: 10, maxHeight: 180, overflowY: "auto", border: "1px solid #e5e7eb", borderRadius: 6, padding: "4px 0" }}>
                  {techs.filter((t) => t.status !== "off-duty").map((t) => {
                    const checked = assignTechs.includes(t.id);
                    return (
                      <label key={t.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "7px 12px", cursor: "pointer", background: checked ? "#f9f0ff" : "transparent", borderLeft: checked ? "3px solid #7a00df" : "3px solid transparent", transition: "all 0.1s" }}>
                        <input type="checkbox" checked={checked} onChange={() => setAssignTechs((prev) => checked ? prev.filter((id) => id !== t.id) : [...prev, t.id])} style={{ accentColor: "#7a00df" }} />
                        <span style={{ flex: 1, fontSize: 13, fontWeight: checked ? 600 : 400 }}>{t.name}</span>
                        <span style={{ fontSize: 11, color: "#94a3b8" }}>{t.specialty}</span>
                        <CapacityBar used={t.activeJobs} total={t.capacity} />
                      </label>
                    );
                  })}
                </div>
                {assignTechs.length > 0 && (
                  <div style={{ fontSize: 12, color: "#7a00df", marginBottom: 8 }}>
                    Selected: {assignTechs.map((id) => TECHS.find((t) => t.id === id)?.name).join(", ")}
                  </div>
                )}
                <button style={S.btn("primary")} disabled={assignTechs.length === 0} onClick={() => assignWO(liveWO.id, assignTechs, assignPri)}>
                  {(liveWO.techIds || []).length > 0 ? "Reassign" : "Assign"} Work Order
                </button>
              </div>
            )}

            {isDispatch && (
              <div style={{ ...sectionStyle, display: "flex", gap: 8, flexWrap: "wrap" }}>
                {liveWO.status === "Assigned" && <button style={S.btn("primary")} onClick={() => startWork(liveWO.id)}>▶ Start Work</button>}
                {liveWO.status === "In Progress" && (
                  <button style={S.btn("success")} onClick={() => { if (compNotes.trim()) completeWork(liveWO.id, compNotes); else toast("Note required", "Add completion notes", "warn"); }}>✓ Complete</button>
                )}
                {!["Completed", "Closed", "Archived"].includes(liveWO.status) && (
                  <button style={S.btn("danger")} onClick={() => setShowCloseForm(!showCloseForm)}>Close / Archive</button>
                )}
              </div>
            )}

            {showCloseForm && isDispatch && (
              <div style={{ ...sectionStyle, background: "#fef2f2" }}>
                <div style={fieldLabel}>Close Note (required)</div>
                <textarea style={S.textarea} value={closeNote} onChange={(e) => setCloseNote(e.target.value)} placeholder="Reason for closing…" />
                <button style={{ ...S.btn("danger"), marginTop: 8 }} disabled={!closeNote.trim()} onClick={() => { closeWO(liveWO.id, closeNote); setShowCloseForm(false); }}>Confirm Close</button>
              </div>
            )}

            {(liveWO.status === "In Progress" || liveWO.completionNotes) && (
              <div style={sectionStyle}>
                <div style={fieldLabel}>Completion Notes</div>
                {isDispatch && liveWO.status === "In Progress" ? (
                  <textarea style={S.textarea} value={compNotes} onChange={(e) => setCompNotes(e.target.value)} placeholder="Describe work completed…" />
                ) : (
                  <div style={{ fontSize: 13, color: "#374151", background: "#f9fafb", padding: 10, borderRadius: 6 }}>{liveWO.completionNotes || "—"}</div>
                )}
              </div>
            )}

            {liveWO.notes && (
              <div style={sectionStyle}>
                <div style={fieldLabel}>Tech Notes</div>
                <div style={{ fontSize: 13, background: "#fffbeb", padding: 10, borderRadius: 6, border: "1px solid #fde68a" }}>{liveWO.notes}</div>
              </div>
            )}

            {liveWO.closedBy && (
              <div style={sectionStyle}>
                <div style={fieldLabel}>Closed By</div>
                <div style={{ fontSize: 13 }}>{liveWO.closedBy}</div>
                <div style={{ fontSize: 12, color: "#94a3b8", marginTop: 4 }}>{liveWO.closedNote}</div>
              </div>
            )}

            {liveWO.type === "renovation" && liveWO.subTrades && (
              <div style={sectionStyle}>
                <div style={{ ...fieldLabel, marginBottom: 10 }}>Sub-Trades</div>
                {liveWO.subTrades.map((st, i) => {
                  const stTech = techs.find((t) => t.id === st.techId);
                  return (
                    <div key={st.id} style={{ padding: "10px 12px", background: "#f9fafb", borderRadius: 6, marginBottom: 6, border: "1px solid #e5e7eb" }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                        <span style={{ fontWeight: 600, fontSize: 13 }}>{st.trade}</span>
                        <StatusBadge status={st.status} />
                      </div>
                      <div style={{ fontSize: 12, color: "#64748b", marginBottom: 4 }}>
                        Tech: {stTech?.name || <span style={{ color: "#d1d5db" }}>Unassigned</span>}
                      </div>
                      {st.notes && <div style={{ fontSize: 12, color: "#94a3b8" }}>{st.notes}</div>}
                      {isDispatch && (
                        <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
                          <select style={{ ...S.select, fontSize: 11, padding: "4px 8px" }} value={st.techId || ""} onChange={(e) => {
                            const updated = [...liveWO.subTrades];
                            updated[i] = { ...updated[i], techId: e.target.value || null, status: e.target.value ? "Assigned" : "Unassigned" };
                            updateWO(liveWO.id, { subTrades: updated });
                          }}>
                            <option value="">Assign tech…</option>
                            {techs.filter((t) => t.status !== "off-duty").map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
                          </select>
                          <select style={{ ...S.select, fontSize: 11, padding: "4px 8px" }} value={st.status} onChange={(e) => {
                            const updated = [...liveWO.subTrades];
                            updated[i] = { ...updated[i], status: e.target.value };
                            updateWO(liveWO.id, { subTrades: updated });
                          }}>
                            {["Unassigned", "Assigned", "In Progress", "Completed"].map((s) => <option key={s} value={s}>{s}</option>)}
                          </select>
                        </div>
                      )}
                    </div>
                  );
                })}
                {isDispatch && (
                  <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                    <select style={{ ...S.select, flex: 1 }} value={newSubTrade} onChange={(e) => setNewSubTrade(e.target.value)}>
                      <option value="">Add sub-trade…</option>
                      {SUB_TRADE_TYPES.filter((t) => !liveWO.subTrades.some((st) => st.trade === t)).map((t) => <option key={t} value={t}>{t}</option>)}
                    </select>
                    <button style={S.btn("secondary")} disabled={!newSubTrade} onClick={() => {
                      const updated = [...liveWO.subTrades, { id: uid(), trade: newSubTrade, status: "Unassigned", techId: null, notes: "" }];
                      updateWO(liveWO.id, { subTrades: updated });
                      setNewSubTrade("");
                      toast("Sub-trade added", newSubTrade);
                    }}>+ Add</button>
                  </div>
                )}
              </div>
            )}

            <div style={sectionStyle}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                <div style={fieldLabel}>Photos ({(liveWO.photos || []).length})</div>
                <label style={{ ...S.btn("secondary"), cursor: "pointer", fontSize: 12, padding: "5px 12px", display: "inline-flex", alignItems: "center", gap: 5 }}>
                  📷 Add Photos
                  <input type="file" accept="image/*" multiple style={{ display: "none" }} onChange={(e) => {
                    const files = Array.from(e.target.files);
                    files.forEach((file) => {
                      const reader = new FileReader();
                      reader.onload = (ev) => {
                        const photo = { id: uid(), dataUrl: ev.target.result, name: file.name, uploadedBy: user.name, time: Date.now() };
                        const existingPhotos = workOrders.find((w) => w.id === liveWO.id)?.photos || [];
                        updateWO(liveWO.id, { photos: [...existingPhotos, photo] });
                      };
                      reader.readAsDataURL(file);
                    });
                    e.target.value = "";
                  }} />
                </label>
              </div>
              {(liveWO.photos || []).length === 0 ? (
                <div style={{ fontSize: 12, color: "#d1d5db" }}>No photos attached yet</div>
              ) : (
                <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                  {(liveWO.photos || []).map((photo) => (
                    <div key={photo.id} style={{ textAlign: "center" }}>
                      <img src={photo.dataUrl} alt={photo.name} title={`Uploaded by ${photo.uploadedBy} · ${fmt(photo.time)}`}
                        style={{ width: 80, height: 80, objectFit: "cover", borderRadius: 6, border: "1px solid #e5e7eb", cursor: "pointer", display: "block" }}
                        onClick={() => window.open(photo.dataUrl, "_blank")} />
                      <div style={{ fontSize: 10, color: "#94a3b8", marginTop: 3, maxWidth: 80, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{photo.uploadedBy}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div style={sectionStyle}>
              <div style={fieldLabel}>Communications Log ({liveWO.communications.length})</div>
              {liveWO.communications.length === 0 && <div style={{ fontSize: 12, color: "#d1d5db", padding: "8px 0" }}>No communications yet</div>}
              {liveWO.communications.map((c) => (

                  <span style={{ color: "#94a3b8", width: 50, flexShrink: 0 }}>→ {c.to}</span>
                  <span style={{ color: "#374151", flex: 1 }}>{c.msg}</span>
                  <span style={{ color: "#d1d5db", whiteSpace: "nowrap" }}>{fmt(c.time)}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

                          <span style={{ fontWeight: 600 }}>{prop?.name}</span>
