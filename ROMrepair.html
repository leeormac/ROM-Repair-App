    // ─── Archive Tab ─────────────────────────────────────────────────────────────

    function ArchiveTab({ workOrders, openDetail }) {
      const [archiveSearch, setArchiveSearch] = useState("");
      const [archiveSortCol, setArchiveSortCol] = useState(null);
      const [archiveSortDir, setArchiveSortDir] = useState("asc");
      const [archiveColFilters, setArchiveColFilters] = useState({});
      const setArcFilter = (col, vals) => setArchiveColFilters((prev) => ({ ...prev, [col]: vals }));
      const onArcSort = (col) => { if (archiveSortCol === col) setArchiveSortDir((d) => d === "asc" ? "desc" : "asc"); else { setArchiveSortCol(col); setArchiveSortDir("asc"); } };

      const searchFiltered = workOrders.filter((wo) => {
        if (archiveSearch) {
          const q = archiveSearch.toLowerCase();
          const prop = PROPERTIES.find((p) => p.id === wo.propertyId);
          const techNames = (wo.techIds || []).map((id) => TECHS.find((t) => t.id === id)?.name || "").join(" ");
          if (!(wo.id.toLowerCase().includes(q) || wo.description?.toLowerCase().includes(q) ||
            wo.tenantName?.toLowerCase().includes(q) || (wo.unit || "").toLowerCase().includes(q) ||
            prop?.name.toLowerCase().includes(q) || techNames.toLowerCase().includes(q) ||
            (wo.category || "").toLowerCase().includes(q) || (wo.createdBy || "").toLowerCase().includes(q) ||
            (wo.dispatchedBy || "").toLowerCase().includes(q))) return false;
        }
        for (const [col, vals] of Object.entries(archiveColFilters)) {
          if (!vals || vals.length === 0) continue;
          const prop = PROPERTIES.find((p) => p.id === wo.propertyId);
          const techNames = (wo.techIds || []).map((id) => TECHS.find((t) => t.id === id)?.name).filter(Boolean);
          let woVal;
          if (col === "property") woVal = prop?.name || "";
          else if (col === "unit") woVal = wo.unit || "";
          else if (col === "category") woVal = wo.category || "";
          else if (col === "createdBy") woVal = wo.createdBy || "";
          else if (col === "dispatchedBy") woVal = wo.dispatchedBy || "";
          else if (col === "techs") { if (!vals.some((v) => techNames.includes(v))) return false; continue; }
          else continue;
          if (!vals.includes(woVal)) return false;
        }
        return true;
      });

      const grouped = {};
      searchFiltered.forEach((wo) => {
        const d = new Date(wo.updated);
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
        const label = d.toLocaleString("en-US", { month: "long", year: "numeric" });
        if (!grouped[key]) grouped[key] = { label, items: [] };
        grouped[key].items.push(wo);
      });
      const months = Object.entries(grouped).sort((a, b) => b[0].localeCompare(a[0]));

      return (
        <div style={{ padding: 18 }}>
          <div style={{ marginBottom: 14, display: "flex", alignItems: "center", gap: 10 }}>
            <input style={{ ...S.input, maxWidth: 360 }} placeholder="Search — ID, description, tenant, tech, property, category…" value={archiveSearch} onChange={(e) => setArchiveSearch(e.target.value)} />
            {archiveSearch && <button onClick={() => setArchiveSearch("")} style={{ ...S.btn("ghost"), padding: "6px 10px", fontSize: 12 }}>Clear</button>}
            <span style={{ fontSize: 12, color: "#94a3b8", marginLeft: "auto" }}>{searchFiltered.length} record{searchFiltered.length !== 1 ? "s" : ""}</span>
          </div>

          {months.length === 0 && (
            <div style={{ padding: 40, textAlign: "center", color: "#94a3b8" }}>
              No archived work orders{archiveSearch ? ` matching "${archiveSearch}"` : ""}
            </div>
          )}

          {months.map(([key, { label, items }], monthIdx) => {
            const avgRes = items.reduce((sum, i) => sum + (i.updated - i.created), 0) / items.length / day;
            const cats = {};
            items.forEach((i) => { cats[i.category] = (cats[i.category] || 0) + 1; });
            const catSummary = Object.entries(cats).map(([c, n]) => `${c} (${n})`).join(", ");
            return (
              <ExpandableSection key={key} title={label} subtitle={`${items.length} WOs · Avg ${avgRes.toFixed(1)}d resolution · ${catSummary}`} defaultOpen={monthIdx === 0}>
                {(() => {
                  const sorted = archiveSortCol ? [...items].sort((a, b) => {
                    const dir = archiveSortDir === "asc" ? 1 : -1;
                    const pA = PROPERTIES.find((p) => p.id === a.propertyId);
                    const pB = PROPERTIES.find((p) => p.id === b.propertyId);
                    const tA = (a.techIds || []).map((id) => TECHS.find((t) => t.id === id)?.name).filter(Boolean).join(", ");
                    const tB = (b.techIds || []).map((id) => TECHS.find((t) => t.id === id)?.name).filter(Boolean).join(", ");
                    switch (archiveSortCol) {
                      case "id": return dir * a.id.localeCompare(b.id);
                      case "property": return dir * (pA?.name || "").localeCompare(pB?.name || "");
                      case "unit": return dir * (a.unit || "").localeCompare(b.unit || "");
                      case "category": return dir * (a.category || "").localeCompare(b.category || "");
                      case "createdBy": return dir * (a.createdBy || "").localeCompare(b.createdBy || "");
                      case "dispatchedBy": return dir * (a.dispatchedBy || "").localeCompare(b.dispatchedBy || "");
                      case "techs": return dir * tA.localeCompare(tB);
                      case "arrived": return dir * ((a.arrivedAt || 0) - (b.arrivedAt || 0));
                      case "completed": return dir * ((a.completedAt || 0) - (b.completedAt || 0));
                      case "duration": {
                        const dA = a.completedAt ? a.completedAt - (a.arrivedAt || a.created) : 0;
                        const dB = b.completedAt ? b.completedAt - (b.arrivedAt || b.created) : 0;
                        return dir * (dA - dB);
                      }
                      case "photos": return dir * ((a.photos || []).length - (b.photos || []).length);
                      default: return 0;
                    }
                  }) : items;

                  const uv = (col) => {
                    const vals = new Set();
                    items.forEach((wo) => {
                      const prop = PROPERTIES.find((p) => p.id === wo.propertyId);
                      if (col === "property") { if (prop) vals.add(prop.name); }
                      else if (col === "unit") { if (wo.unit) vals.add(wo.unit); }
                      else if (col === "category") { if (wo.category) vals.add(wo.category); }
                      else if (col === "createdBy") { if (wo.createdBy) vals.add(wo.createdBy); }
                      else if (col === "dispatchedBy") { if (wo.dispatchedBy) vals.add(wo.dispatchedBy); }
                      else if (col === "techs") { (wo.techIds || []).forEach((id) => { const t = TECHS.find((t) => t.id === id); if (t) vals.add(t.name); }); }
                    });
                    return [...vals].sort();
                  };

                  return (
                    <div style={{ overflowX: "auto", margin: "0 -16px" }}>
                      <table style={{ minWidth: 900 }}>
                        <thead>
                          <tr style={{ background: "#fafbfc" }}>
                            {[
                              { col: "id", label: "WO #", filterable: false },
                              { col: "property", label: "Property", filterable: true },
                              { col: "unit", label: "Unit", filterable: true },
                              { col: "category", label: "Category", filterable: true },
                              { col: "createdBy", label: "Created By", filterable: true },
                              { col: "dispatchedBy", label: "Dispatched By", filterable: true },
                              { col: "techs", label: "Tech(s)", filterable: true },
                              { col: "arrived", label: "Arrived", filterable: false },
                              { col: "completed", label: "Completed", filterable: false },
                              { col: "duration", label: "Duration", filterable: false },
                              { col: "photos", label: "Photos", filterable: false },
                            ].map(({ col, label, filterable }) => (
                              <SortFilterTh key={col} col={col} label={label} sortCol={archiveSortCol} sortDir={archiveSortDir} onSort={onArcSort} colFilters={archiveColFilters} uniqueVals={filterable ? uv(col) : null} onFilter={setArcFilter} />
                            ))}
                          </tr>
                        </thead>
                        <tbody>
                          {sorted.map((wo) => {
                            const prop = PROPERTIES.find((p) => p.id === wo.propertyId);
                            const allTechNames = [
                              ...(wo.techIds || []).map((id) => TECHS.find((t) => t.id === id)?.name),
                              ...(wo.subTrades || []).map((st) => TECHS.find((t) => t.id === st.techId)?.name),
                            ].filter((n, i, arr) => n && arr.indexOf(n) === i);
                            const durationMs = wo.completedAt ? wo.completedAt - (wo.arrivedAt || wo.created) : null;
                            const duration = durationMs != null
                              ? durationMs < day ? `${Math.round(durationMs / 3600000)}h` : `${(durationMs / day).toFixed(1)}d`
                              : "—";
                            const photoCount = (wo.photos || []).length;
                            return (
                              <tr key={wo.id} onClick={() => openDetail(wo)} style={{ cursor: "pointer", transition: "background 0.1s" }}>
                                <td style={{ ...S.td, fontWeight: 700, color: "#7a00df", fontSize: 12 }}>{wo.id}</td>
                                <td style={{ ...S.td, fontWeight: 500 }}>{prop?.name || "—"}</td>
                                <td style={{ ...S.td, fontSize: 12 }}>{wo.unit || "—"}</td>
                                <td style={S.td}>{wo.category || "—"}</td>
                                <td style={{ ...S.td, fontSize: 12 }}>{wo.createdBy || <span style={{ color: "#d1d5db" }}>—</span>}</td>
                                <td style={{ ...S.td, fontSize: 12 }}>{wo.dispatchedBy || <span style={{ color: "#d1d5db" }}>—</span>}</td>
                                <td style={{ ...S.td, fontSize: 12 }}>{allTechNames.length ? <span style={{ fontWeight: 500 }}>{allTechNames.join(", ")}</span> : <span style={{ color: "#d1d5db" }}>—</span>}</td>
                                <td style={{ ...S.td, color: "#64748b", fontSize: 12 }}>{wo.arrivedAt ? fmt(wo.arrivedAt) : <span style={{ color: "#d1d5db" }}>—</span>}</td>
                                <td style={{ ...S.td, color: "#64748b", fontSize: 12 }}>{wo.completedAt ? fmt(wo.completedAt) : <span style={{ color: "#d1d5db" }}>—</span>}</td>
                                <td style={{ ...S.td, fontSize: 12, color: "#64748b" }}>{duration}</td>
                                <td style={{ ...S.td, fontSize: 12 }}>{photoCount > 0 ? <span style={{ color: "#7a00df", fontWeight: 600 }}>📷 {photoCount}</span> : <span style={{ color: "#d1d5db" }}>—</span>}</td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  );
                })()}
              </ExpandableSection>
            );
          })}
        </div>
      );
    }

    function ExpandableSection({ title, subtitle, defaultOpen = false, children }) {
      const [open, setOpen] = useState(defaultOpen);
      return (
        <div style={{ marginBottom: 12, background: "#fff", borderRadius: 8, border: "1px solid #e5e7eb" }}>
          <div onClick={() => setOpen(!open)} style={{ padding: "12px 16px", cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <span style={{ fontWeight: 600, fontSize: 14 }}>{title}</span>
              {subtitle && <span style={{ fontSize: 12, color: "#94a3b8", marginLeft: 10 }}>{subtitle}</span>}
            </div>
            <span style={{ transform: open ? "rotate(180deg)" : "rotate(0deg)", transition: "0.2s" }}>▼</span>
          </div>
          {open && <div style={{ padding: "0 16px 16px" }}>{children}</div>}
        </div>
      );
    }

    // ─── Tenant View ─────────────────────────────────────────────────────────────

    function TenantView({ user, workOrders, toast, setWorkOrders }) {
      const [showForm, setShowForm] = useState(false);
      const [cat, setCat] = useState("Plumbing");
      const [desc, setDesc] = useState("");
      const [urgent, setUrgent] = useState(false);

      const myWOs = workOrders.filter((wo) => wo.tenantId === user.id);

      const submit = () => {
        if (!desc.trim()) { toast("Missing info", "Please describe the issue", "warn"); return; }
        const wo = {
          id: `WO-${1100 + Math.floor(Math.random() * 900)}`,
          type: "repair", propertyId: user.propertyId, unit: user.unit, category: cat,
          description: desc, urgency: urgent, status: "Unassigned", priority: urgent ? "High" : "Medium",
          techId: null, tenantId: user.id, tenantName: user.name,
          created: Date.now(), updated: Date.now(), communications: [], notes: "", completionNotes: "", closedBy: null, closedNote: "",
        };
        setWorkOrders((p) => [wo, ...p]);
        toast("Submitted!", `Request ${wo.id} created`, "info");
        setShowForm(false); setDesc(""); setUrgent(false);
      };

      return (
        <div style={{ ...S.page, maxWidth: 700 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "20px 0 12px" }}>
            <div style={S.h2}>My Maintenance Requests</div>
            <button style={S.btn("primary")} onClick={() => setShowForm(!showForm)}>+ New Request</button>
          </div>

          {showForm && (
            <div style={{ ...S.card, padding: 20, marginBottom: 16 }}>
              <div style={{ marginBottom: 10 }}>
                <div style={S.label}>Category</div>
                <select style={{ ...S.select, width: "100%", marginTop: 4 }} value={cat} onChange={(e) => setCat(e.target.value)}>
                  {CATEGORIES.map((c) => <option key={c}>{c}</option>)}
                </select>
              </div>
              <div style={{ marginBottom: 10 }}>
                <div style={S.label}>Description</div>
                <textarea style={{ ...S.textarea, marginTop: 4 }} rows={3} value={desc} onChange={(e) => setDesc(e.target.value)} placeholder="Describe the issue in detail…" />
              </div>
              <label style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14, fontSize: 13, cursor: "pointer" }}>
                <input type="checkbox" checked={urgent} onChange={(e) => setUrgent(e.target.checked)} /> Mark as urgent (safety concern, water leak, etc.)
              </label>
              <div style={{ display: "flex", gap: 8 }}>
                <button style={S.btn("primary")} onClick={submit}>Submit Request</button>
                <button style={S.btn("secondary")} onClick={() => setShowForm(false)}>Cancel</button>
              </div>
            </div>
          )}

          {myWOs.length === 0 ? (
            <div style={{ ...S.card, padding: 40, textAlign: "center", color: "#94a3b8" }}>No requests yet. Submit one above!</div>
          ) : myWOs.map((wo) => (
            <div key={wo.id} style={{ ...S.card, padding: 16, marginBottom: 10 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <span style={{ ...S.mono, fontWeight: 600, color: "#7a00df" }}>{wo.id}</span>
                  <span style={{ fontSize: 12, color: "#64748b" }}>{wo.category}</span>
                </div>
                <StatusBadge status={wo.status} />
              </div>
              <div style={{ fontSize: 13, marginBottom: 8, color: "#374151" }}>{wo.description}</div>
              <div style={{ borderLeft: "2px solid #e5e7eb", marginLeft: 6, paddingLeft: 14 }}>
                <TimelineItem label="Submitted" time={wo.created} done />
                <TimelineItem label="Assigned" time={wo.status !== "Unassigned" ? wo.updated : null} done={wo.status !== "Unassigned"} />
                <TimelineItem label="In Progress" time={wo.status === "In Progress" ? wo.updated : null} done={["In Progress", "Completed", "Closed", "Archived"].includes(wo.status)} />
                <TimelineItem label="Completed" time={["Completed", "Closed", "Archived"].includes(wo.status) ? wo.updated : null} done={["Completed", "Closed", "Archived"].includes(wo.status)} last />
              </div>
              {wo.communications.filter((c) => c.to === "tenant").length > 0 && (
                <div style={{ marginTop: 10, padding: "8px 10px", background: "#f9fafb", borderRadius: 6 }}>
                  <div style={{ fontSize: 11, fontWeight: 600, color: "#64748b", marginBottom: 4 }}>Messages</div>
                  {wo.communications.filter((c) => c.to === "tenant").map((c) => (
                    <div key={c.id} style={{ fontSize: 12, color: "#374151", padding: "3px 0" }}>
                      <span style={{ ...S.mono, color: "#7a00df", fontSize: 10, marginRight: 6 }}>{c.type.toUpperCase()}</span>
                      {c.msg} <span style={{ color: "#d1d5db", marginLeft: 4 }}>{fmt(c.time)}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          ))}
        </div>
      );
    }

    function TimelineItem({ label, time, done, last }) {
      return (
        <div style={{ display: "flex", gap: 8, alignItems: "flex-start", paddingBottom: last ? 0 : 8, position: "relative" }}>
          <div style={{ position: "absolute", left: -20, top: 2, width: 10, height: 10, borderRadius: "50%", background: done ? "#7a00df" : "#e5e7eb", border: "2px solid #fff" }} />
          <div>
            <span style={{ fontSize: 12, fontWeight: done ? 600 : 400, color: done ? "#374151" : "#d1d5db" }}>{label}</span>
            {time && <span style={{ fontSize: 11, color: "#94a3b8", marginLeft: 6 }}>{fmt(time)}</span>}
          </div>
        </div>
      );
    }

    // ─── Tech View ───────────────────────────────────────────────────────────────

    function TechView({ user, workOrders, techs, startWork, completeWork, flagReview, stopWork, updateWO, toast }) {
      const [selectedWO, setSelectedWO] = useState(null);
      const [flagNote, setFlagNote] = useState("");
      const [compNote, setCompNote] = useState("");

      const tech = techs.find((t) => t.id === user.techId);
      const myWOs = workOrders.filter((wo) => {
        if ((wo.techIds || []).includes(user.techId)) return true;
        if (wo.subTrades?.some((st) => st.techId === user.techId)) return true;
        return false;
      }).filter((wo) => !["Archived", "Closed"].includes(wo.status));

      const sorted = [...myWOs].sort((a, b) => {
        const priOrd = { Urgent: 0, High: 1, Medium: 2, Low: 3 };
        return (priOrd[a.priority] ?? 9) - (priOrd[b.priority] ?? 9);
      });

      return (
        <div style={{ ...S.page, maxWidth: 500, padding: "0 12px 24px" }}>
          <div style={{ padding: "16px 0 8px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={S.h2}>My Jobs</div>
              <div style={{ fontSize: 12, color: "#94a3b8" }}>{tech?.name} · {tech?.specialty}</div>
            </div>
            <span style={{ ...S.badge({ bg: TECH_STATUS_COLORS[tech?.status] + "22", text: TECH_STATUS_COLORS[tech?.status] }), textTransform: "capitalize" }}>{tech?.status}</span>
          </div>

          {sorted.map((wo) => (
            <div key={wo.id} style={{ ...S.card, marginBottom: 10, overflow: "hidden" }}>
              <div onClick={() => setSelectedWO(selectedWO === wo.id ? null : wo.id)} style={{ padding: "14px 16px", cursor: "pointer" }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                  <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                    <span style={{ ...S.mono, fontWeight: 700, color: "#7a00df" }}>{wo.id}</span>
                    <PriorityBadge priority={wo.priority} />
                  </div>
                  <StatusBadge status={wo.status} />
                </div>
                <div style={{ fontSize: 13, color: "#374151", marginBottom: 4 }}>{wo.description?.slice(0, 80)}</div>
                <div style={{ fontSize: 12, color: "#94a3b8" }}>{PROPERTIES.find((p) => p.id === wo.propertyId)?.name} · Unit {wo.unit} · {wo.category}</div>
              </div>

              {selectedWO === wo.id && (
                <div style={{ padding: "0 16px 16px", borderTop: "1px solid #f3f4f6" }}>
                  <div style={{ padding: "12px 0" }}>
                    <div style={{ fontSize: 13, lineHeight: 1.5, marginBottom: 10 }}>{wo.description}</div>
                    {wo.notes && <div style={{ fontSize: 12, background: "#fffbeb", padding: 8, borderRadius: 6, marginBottom: 10, border: "1px solid #fde68a" }}>{wo.notes}</div>}

                    {wo.type === "renovation" && wo.subTrades?.filter((st) => st.techId === user.techId).map((st) => (
                      <div key={st.id} style={{ padding: 8, background: "#f0f1f5", borderRadius: 6, marginBottom: 6, fontSize: 12 }}>
                        <strong>{st.trade}</strong> — <StatusBadge status={st.status} />
                        {st.notes && <div style={{ marginTop: 4, color: "#64748b" }}>{st.notes}</div>}
                      </div>
                    ))}

                    <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 8 }}>
                      {wo.status === "Assigned" && <button style={S.btn("primary")} onClick={() => startWork(wo.id)}>▶ Start Work</button>}
                      {wo.status === "In Progress" && (
                        <>
                          <input style={{ ...S.input, maxWidth: 200 }} placeholder="Completion notes…" value={compNote} onChange={(e) => setCompNote(e.target.value)} />
                          <button style={S.btn("success")} onClick={() => { if (compNote.trim()) { completeWork(wo.id, compNote); setCompNote(""); } else toast("Notes required", "", "warn"); }}>✓ Complete</button>
                          <button style={S.btn("secondary")} onClick={() => stopWork(wo.id)}>⏹ Stop</button>
                        </>
                      )}
                      {!["Completed", "Needs Review"].includes(wo.status) && (
                        <>
                          <input style={{ ...S.input, maxWidth: 180 }} placeholder="Flag note…" value={flagNote} onChange={(e) => setFlagNote(e.target.value)} />
                          <button style={S.btn("danger")} onClick={() => { if (flagNote.trim()) { flagReview(wo.id, flagNote); setFlagNote(""); } else toast("Note required", "", "warn"); }}>Flag</button>
                        </>
                      )}
                    </div>

                    <div style={{ borderTop: "1px solid #f3f4f6", paddingTop: 10, marginTop: 6 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                        <span style={{ fontSize: 11, fontWeight: 600, color: "#64748b", textTransform: "uppercase", letterSpacing: "0.04em" }}>Photos ({(wo.photos || []).length})</span>
                        <label style={{ fontSize: 12, color: "#7a00df", cursor: "pointer", fontWeight: 500 }}>
                          📷 Add
                          <input type="file" accept="image/*" multiple style={{ display: "none" }} onChange={(e) => {
                            const files = Array.from(e.target.files);
                            files.forEach((file) => {
                              const reader = new FileReader();
                              reader.onload = (ev) => {
                                const photo = { id: uid(), dataUrl: ev.target.result, name: file.name, uploadedBy: user.name, time: Date.now() };
                                const existingPhotos = workOrders.find((w) => w.id === wo.id)?.photos || [];
                                updateWO(wo.id, { photos: [...existingPhotos, photo] });
                              };
                              reader.readAsDataURL(file);
                            });
                            e.target.value = "";
                          }} />
                        </label>
                      </div>
                      {(wo.photos || []).length === 0 ? (
                        <div style={{ fontSize: 11, color: "#d1d5db" }}>No photos yet — tap Add to attach job photos</div>
                      ) : (
                        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                          {(wo.photos || []).map((photo) => (
                            <img key={photo.id} src={photo.dataUrl} alt={photo.name} title={`${photo.uploadedBy} · ${fmt(photo.time)}`}
                              style={{ width: 64, height: 64, objectFit: "cover", borderRadius: 6, border: "1px solid #e5e7eb", cursor: "pointer" }}
                              onClick={() => window.open(photo.dataUrl, "_blank")} />
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}
            </div>
          ))}

          {sorted.length === 0 && <div style={{ ...S.card, padding: 40, textAlign: "center", color: "#94a3b8" }}>No active jobs. You're all caught up!</div>}
        </div>
      );
    }

    // ─── Mount ───────────────────────────────────────────────────────────────────

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<ROMrepair />);
  </script>
</body>
</html>
